talks:
- date: "2026-11-12"
  title: "Spatial analysis of acoustic scenes"
  speakers:
  - name: "Tuomas Virtanen"
    url: "https://homepages.tuni.fi/tuomas.virtanen/"
  affiliation: "Tampere University"
  abstract: >- 
    Speech communication takes place in physical spaces where spatial relationships between participants influence both speech production and interaction dynamics. This presentation explores how microphone arrays and machine learning can be used to analyze spatial information in acoustic scenes beyond linguistic content, enabling estimation of sound sources that are present, where they are located, and how they are oriented. The talk reviews recent advances in source localization and detection, and orientation estimation, and discusses challenges related to the strong dependence of learned models on microphone array geometries. Approaches for array-independent spatial analysis are presented as a path toward more robust and widely deployable systems. The presentation also discusses how spatial information can support separation of overlapping speech for robust analysis of multi-speaker scenes.
  bio: >- 
    Tuomas Virtanen is Professor at Tampere University, Finland, where he is leading the Audio Research Group. He received the M.Sc. and Doctor of Science degrees in information technology from Tampere University of Technology in 2001 and 2006, respectively. He has also been working as a research associate at Cambridge University Engineering Department, UK. He is known for his pioneering work on computational acoustic scene analysis and sound source separation. His research interests include machine listening, computational content analysis of audio, and machine learning for audio. He has authored more than 300 scientific publications on the above topics, which have been cited more than 20000 times. He has received IEEE Signal Processing Society best paper awards multiple times, as well as many other best paper awards. He is an IEEE Fellow, IEEE Signal Processing Society Distinguished Lecturer 2024-2025, recipient of the ERC 2014 Starting Grant, and has been a member of the Audio and Acoustic Signal Processing Technical Committee of IEEE Signal Processing Society.
