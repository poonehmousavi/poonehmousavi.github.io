- date: "2026-12-10"
  title: "Loss Functions Matter: Three Case Studies in Informed Loss Design"
  speakers:
  - name: "Meinard Müller"
    url: "https://www.audiolabs-erlangen.de/fau/professor/mueller"
  affiliation: "Friedrich-Alexander-Universität Erlangen-Nürnberg (FAU)"
  abstract: >- 
    Loss functions are fundamental to deep learning, as they quantify the discrepancy between model predictions and reference targets. They guide the optimization process and have a direct impact on model performance and convergence. Nevertheless, loss design and configuration are often treated as secondary aspects, which can result in unstable training and solutions that fail to capture the structure and objectives of the task. In this presentation, with a focus on audio and music processing, we highlight the importance of well-designed loss functions through three specific case studies. First, we revisit the Multi-Scale Spectral Loss for audio synthesis and analyze how different configurations affect gradient quality and training stability. Second, we introduce a loss function for hierarchical classification that promotes consistency across multiple levels of semantic attributes (e.g., singing activity, gender, and voice type in music audio classification). Third, we discuss a differentiable version of dynamic time warping, designed for learning from weakly aligned data, and discuss strategies for improving training stability. Rather than providing a general overview, we focus on concrete examples to show how incorporating prior knowledge and task-specific structure into loss functions can lead to more robust and interpretable learning outcomes. 
  bio: >-  
    Meinard Müller received the Diploma degree (1997) in mathematics and the Ph.D. degree (2001) in computer science from the University of Bonn, Germany. Since 2012, he has held a professorship for Semantic Audio Signal Processing at the International Audio Laboratories Erlangen, a joint institute of the Friedrich-Alexander-Universität Erlangen-Nürnberg (FAU) and the Fraunhofer Institute for Integrated Circuits IIS. His recent research interests include music processing, music information retrieval, audio signal processing, and motion processing. He was a member of the IEEE Audio and Acoustic Signal Processing Technical Committee (2010-2015), a member of the Senior Editorial Board of the IEEE Signal Processing Magazine (2018-2022), and a member of the Board of Directors, International Society for Music Information Retrieval (2009-2021, being its president in 2020/2021). In 2020, he was elevated to IEEE Fellow for contributions to music signal processing. Currently, he also serves as Editor-in-Chief for the Transactions of the International Society for Music Information Retrieval (TISMIR). Besides his scientific research, Meinard Müller has been very active in teaching music and audio processing. He gave numerous tutorials at major conferences, including ICASSP (2009, 2011, 2019) and ISMIR (2007, 2010, 2011, 2014, 2017, 2019, 2023, 2024, 2025). Furthermore, he wrote a monograph titled "Information Retrieval for Music and Motion" (Springer 2007) as well as a textbook titled "Fundamentals of Music Processing" (Springer-Verlag 2015).  paper_list:
