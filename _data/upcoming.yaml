    url: "https://arxiv.org/pdf/2603.05299"
    venue: "Interspeech 2026"


- date: "2026-12-03"
  title: "The Perception-Distortion Tradeoff in Speech Enhancement"
  speakers:
  - name: "Julius Richter"
    url: "https://merl.com/people/richter"
  affiliation: "MERL"
  abstract: >- 
    Speech enhancement aims to recover clean speech from noisy recordings, with applications in speech communication, human–machine interaction, and assistive technologies. A central challenge is to improve perceptual quality while preserving speech content and minimizing signal distortion. In this talk, I will discuss two paradigms for speech enhancement: predictive models, which directly estimate clean speech from noisy observations, and generative models, which leverage learned speech distributions to reconstruct clean speech. I will examine their complementary strengths and limitations, particularly the trade-off between perceptual quality and signal distortion, as well as the risk of introducing speech hallucinations. I will then explore hybrid approaches that combine the strengths of both paradigms. Building on my earlier work on score-based generative models for speech enhancement (SGMSE), I will present two recent research contributions: SIPS, a plug-and-play framework that combines pretrained predictive models with a generative speech prior to improve perceptual speech quality, and FlowSE-RAM, which employs reward-based post-training guided by automatic speech recognition to mitigate speech hallucinations and reduce word error rates on real-world recordings.  bio: >-
  bio: >-  
    Julius Richter is a Visiting Research Scientist at Mitsubishi Electric Research Laboratories (MERL). His research interests include generative modeling and multimodal learning for audio-visual understanding and restoration. During his Ph.D. at the University of Hamburg, he developed diffusion-based generative methods for single-channel speech enhancement. Prior to joining MERL, he was a postdoctoral researcher at Meta Superintelligence Labs.  paper_list:
