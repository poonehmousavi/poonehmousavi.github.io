talks:
- date: "2026-10-08"
  title: "Towards Fully Open General Audio Intelligence"
  speakers:
  - name: "Sreyan Ghosh"
    url: "https://sreyan88.github.io/"
  affiliation: "Google DeepMind"
  papers_page: "https://sreyan88.github.io/research/"
  abstract: >-
    What does it take for AI to understand the world through audio? In this talk, I will present our work
    on fully open large audio-language models, highlighting advances in architectures, training curricula,
    and internet-scale data curation. I will explore how unified encoders connect speech, sound, and music,
    and how new data and training infrastructure extend audio understanding from short clips to 30-minute
    recordings. Along the way, expert-level benchmarks reveal persistent gaps between current models and
    human audio reasoning. Finally, I will show how audio enriches real-world video comprehension, and
    discuss our work integrating audio into world models. Together, these directions highlight why listening
    is essential to AI systems that understand and model the world.
  bio: >-
    Sreyan Ghosh is a Research Scientist at Google DeepMind, where he works on audio and audio-visual
    intelligence for Gemini. His research focuses on speech-to-speech modeling, speech translation, large
    audio-language models, audio representation learning, and long-form audio understanding and reasoning.
    He completed his Ph.D. in Computer Science at the University of Maryland, College Park, advised by
    Dinesh Manocha and Ramani Duraiswami. During his Ph.D., he co-led the development of the Audio Flamingo
    family of models and the MMAU series of audio understanding and reasoning benchmarks. Previously,
    he held research internships at Nvidia, Adobe and Microsoft. He is a recipient of the NVIDIA Graduate
    Fellowship and UMD’s Outstanding Graduate Assistant Award.
- date: "2026-10-15"
  title: "Sound Design AI"
  speakers:
  - name: "Oriol Nieto"
    url: "https://www.urinieto.com/about/"
  affiliation: "Adobe Research"
  abstract: "Sound design has traditionally been expensive, slow, and daunting, with creators sifting through large sound-effect libraries to find and time the right audio. This talk presents the recent work of Adobe Research's Sound Design AI (SODA) team, which is building generative tools that make professional sound design faster, more affordable, and more intuitive. We trace a progression of increasingly expressive controls: from text-to-SFX, to voice-to-SFX driven by vocal imitations (Sketch2Sound), to video-guided Foley generation with multimodal controls (MultiFoley) that syncs sound to on-screen action. We then look toward fully agentic, story-driven soundscape design (Sound Stager), alongside supporting technologies for understanding, editing, and reshaping audio: timestamped audio captioning (TAC), prompt-based sound separation (PromptSep), generative sound morphing (Mix2Morph), generative audio extension (GenExtend), and structured metadata for sound libraries (AudioCards). Together, these advances point toward a future where anyone can create rich, well-timed, and highly controllable soundscapes with minimal cost and effort."
  bio: "Oriol is a Senior Research Engineer 2 at Adobe Research, where he focuses on human-centered AI for audio creativity, encompassing everything from music to audiobooks, video editing, and, more recently, sound design. He holds a PhD in Music Technology from MARL, NYU, a Master's in Music, Science, and Technology from Stanford University, and a Master's in Information Technologies from Pompeu Fabra University. Highly involved with the Music Information Retrieval community, he served as General Chair for ISMIR 2024 in San Francisco. Oriol has authored relevant open-source MIR packages such as librosa, mir-eval, and MSAF; contributed to PyTorch; and plays guitar, violin, cajón, and sings (and screams) in his spare time."
